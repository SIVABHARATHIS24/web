<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#021631"/>
      <stop offset=".45" stop-color="#05396a"/>
      <stop offset=".8" stop-color="#0a6b8a"/>
      <stop offset="1" stop-color="#084a63"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff" stop-opacity="0"/>
      <stop offset=".4" stop-color="#7cf2ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9dff9a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb5ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#3fb5ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3fb5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6ffcf" stop-opacity="0"/>
      <stop offset=".6" stop-color="#b6ffcf" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b6ffcf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <radialGradient id="glow" cx=".25" cy=".2" r=".6">
      <stop offset="0" stop-color="#4fd2ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4fd2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- Aurora light ribbons -->
  <path d="M-100 640 C 300 420, 700 760, 1100 520 S 1600 380, 1750 460" stroke="url(#r1)" stroke-width="120" fill="none" filter="url(#softer)"/>
  <path d="M-100 640 C 300 420, 700 760, 1100 520 S 1600 380, 1750 460" stroke="url(#r1)" stroke-width="6" fill="none" filter="url(#soft)" opacity=".9"/>
  <path d="M-100 720 C 350 520, 760 820, 1150 600 S 1600 470, 1750 540" stroke="url(#r2)" stroke-width="70" fill="none" filter="url(#softer)"/>
  <path d="M-100 720 C 350 520, 760 820, 1150 600 S 1600 470, 1750 540" stroke="#bff6ff" stroke-opacity=".35" stroke-width="3" fill="none" filter="url(#soft)"/>
  <path d="M-100 560 C 260 380, 640 660, 1040 450 S 1550 300, 1750 380" stroke="url(#r3)" stroke-width="40" fill="none" filter="url(#softer)"/>
  <path d="M-100 800 C 400 640, 820 880, 1200 700 S 1600 600, 1750 640" stroke="url(#r2)" stroke-width="2" stroke-opacity=".6" fill="none"/>
</svg>
