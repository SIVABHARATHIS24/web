# nginx site for the Varnika Healthcare website.
# setup-server.sh copies this to /etc/nginx/sites-available/varnika and
# replaces DOMAIN with your domain. Certbot then adds the HTTPS settings.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    root /var/www/varnika;
    index index.html;

    # Static site: serve the file, or 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache images, styles and scripts for a week.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never serve the deploy scripts or docs.
    location ~ ^/(deploy|README\.md) {
        return 404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
