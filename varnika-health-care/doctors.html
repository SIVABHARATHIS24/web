<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Doctor — Varnika Health Care</title>
  <meta name="description" content="Search Varnika Health Care's specialist doctors by name, department and availability, and book an appointment online.">
  <meta name="theme-color" content="#0f8b8d">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var t=localStorage.getItem("vhc-theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body data-page="doctors">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-include="header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Doctors</span></nav>
        <h1>Find the right doctor</h1>
        <p>Search by name, speciality or language, check which days they're available, and book in a tap.</p>
      </div>
    </section>

    <section class="section" style="padding-top:48px">
      <div class="container">
        <div class="toolbar">
          <div class="search">
            <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
            <label class="sr-only" for="doc-search">Search doctors</label>
            <input id="doc-search" type="search" placeholder="Search by name, speciality or language">
          </div>
          <label class="sr-only" for="doc-dept">Department</label>
          <select class="select" id="doc-dept"></select>
          <label class="sr-only" for="doc-day">Availability</label>
          <select class="select" id="doc-day"></select>
        </div>
        <p class="muted" style="margin:-16px 0 24px;font-weight:600" id="doc-count" aria-live="polite"></p>
        <div class="grid grid-3" id="doc-grid"></div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
